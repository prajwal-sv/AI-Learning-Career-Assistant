data:
  raw_dir: data/raw
  processed_dir: data/processed
  separator: ";"
  raw_files:
    mat: student-mat.csv
    por: student-por.csv

target:
  column: G3
  pass_mark: 10        # G3 >= 10 means pass (grades are 0 to 20)

cleaning:
  # Allowed [min, max] for every numeric column. Rows outside are invalid.
  valid_ranges:
    age: [15, 22]
    Medu: [0, 4]
    Fedu: [0, 4]
    traveltime: [1, 4]
    studytime: [1, 4]
    failures: [0, 3]
    famrel: [1, 5]
    freetime: [1, 5]
    goout: [1, 5]
    Dalc: [1, 5]
    Walc: [1, 5]
    health: [1, 5]
    absences: [0, 100]
    G1: [0, 20]
    G2: [0, 20]
    G3: [0, 20]