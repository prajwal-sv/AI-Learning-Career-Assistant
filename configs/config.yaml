on:
  push:
    branches: [main, v2-dev]
  pull_request:
    branches: [main]
data:
  raw_dir: data/raw
  processed_dir: data/processed
  separator: ";"
  raw_files:
    mat: student-mat.csv
    por: student-por.csv

target:
  column: G3
  pass_mark: 10        # G3 >= 10 means pass (grades are 0 to 20)

cleaning:
  # Allowed [min, max] for every numeric column. Rows outside are invalid.
  valid_ranges:
    age: [15, 22]
    Medu: [0, 4]
    Fedu: [0, 4]
    traveltime: [1, 4]
    studytime: [1, 4]
    failures: [0, 3]
    famrel: [1, 5]
    freetime: [1, 5]
    goout: [1, 5]
    Dalc: [1, 5]
    Walc: [1, 5]
    health: [1, 5]
    absences: [0, 100]
    G1: [0, 20]
    G2: [0, 20]
    G3: [0, 20]

ml:
  test_size: 0.2
  random_state: 42     # fixed seed = same split every run
  cv_folds: 5
  
clustering:
  columns: [studytime, absences, failures, G1, G2]
  n_clusters: 4
  random_state: 42

tuning:
  enabled: true          # false = run exactly like V1 (no tuning)
  n_iter: 15             # random combinations tried per model
  inner_folds: 3         # folds used inside the search
  params_path: models/registry/best_params.json


registry:
  model_path: models/registry/student_model.joblib
  metrics_path: models/registry/metrics.json
  include_prior_grades: true   # true = Set A (uses G1, G2). false = Set B

merge:
  keys: [school, sex, age, address, famsize, Pstatus, Medu, Fedu, Mjob, Fjob, reason, nursery, internet]
  output_file: student_merged_clean.csv

recommendations:
  weak_mark_below: 10          # 0-20 scale (the project document's "below 50 out of 100")
  moderate_mark_below: 13      # from weak_mark_below up to here = moderate
  strong_mark_from: 15         # this mark or higher = strong
  low_study_time_code: 1       # 1 = less than 2 hours a week (or lower)
  high_absences: 10            # this many absences or more in one subject
  failures_flag_from: 1        # this many earlier class failures or more
  big_subject_gap: 3           # marks between best and weakest subject
  practice_sessions_per_week: 3
  practice_minutes: 30